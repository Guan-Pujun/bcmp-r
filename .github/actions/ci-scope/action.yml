name: Determine R CI scope
description: Keep required checks conclusive while avoiding R computation for documentation-only pull requests.
outputs:
  run:
    description: Whether package computation is required.
    value: ${{ steps.scope.outputs.run }}
runs:
  using: composite
  steps:
    - id: scope
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          let run = true;
          if (context.eventName === "pull_request") {
            const pull = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pull.number, per_page: 100
            });
            const isDocumentation = path =>
              path.startsWith("docs/") || /^[^/]+\.md$/.test(path);
            // Incomplete file lists must never suppress package checks.
            const docsOnly = files.length > 0 &&
              files.length === pull.changed_files &&
              files.every(file => isDocumentation(file.filename) &&
                (!file.previous_filename || isDocumentation(file.previous_filename)));
            run = !docsOnly;
          }
          core.setOutput("run", String(run));
          await core.summary.addRaw(run
            ? "Package or CI changes: running the required R checks."
            : "Documentation-only changes: R computation is not applicable; this check is complete."
          ).write();
