name: Documentation

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the reviewed static manual to GitHub Pages
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "man/**"
      - "DESCRIPTION"
      - "README.md"
      - ".github/scripts/help.R"
      - ".github/scripts/common.R"
      - ".github/scripts/audit.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "man/**"
      - "DESCRIPTION"
      - "README.md"
      - ".github/scripts/help.R"
      - ".github/scripts/common.R"
      - ".github/scripts/audit.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.deploy || false }}
  cancel-in-progress: ${{ !inputs.deploy }}

env:
  R_KEEP_PKG_SOURCE: "yes"

jobs:
  documentation:
    name: Static manual and R help
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated output directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bcmp-ci" "$RUNNER_TEMP/bcmp-tmp"
          printf '%s\n' "BCMP_CI_OUTPUT=$RUNNER_TEMP/bcmp-ci" "TMPDIR=$RUNNER_TEMP/bcmp-tmp" >> "$GITHUB_ENV"
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: Set up PDF tools
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Install CI dependencies
        env:
          R_KEEP_PKG_SOURCE: "no"
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: '"hard"'
          cache-version: "docs-deps-no-source-v1"
          extra-packages: |

      - name: Validate local resources and anchors
        shell: bash
        run: python3 .github/scripts/audit.py docs --output "$BCMP_CI_OUTPUT/documentation-audit.json"
      - name: Check Rd and render package help
        run: Rscript .github/scripts/help.R
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: |
            ${{ env.BCMP_CI_OUTPUT }}/*.log
            ${{ env.BCMP_CI_OUTPUT }}/*.txt
            ${{ env.BCMP_CI_OUTPUT }}/*.csv
            ${{ env.BCMP_CI_OUTPUT }}/*.json
            ${{ env.BCMP_CI_OUTPUT }}/*.xml
            ${{ env.BCMP_CI_OUTPUT }}/*.pdf
            ${{ env.BCMP_CI_OUTPUT }}/*.html
            ${{ env.BCMP_CI_OUTPUT }}/*.tar.gz
            ${{ env.BCMP_CI_OUTPUT }}/SHA256SUMS
            ${{ env.BCMP_CI_OUTPUT }}/check/**/*.log
            ${{ env.BCMP_CI_OUTPUT }}/check/**/*.Rout*
            ${{ env.BCMP_CI_OUTPUT }}/check/**/*.pdf
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reviewed static manual for Pages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' && github.repository == 'Guan-Pujun/bcmp-r' && github.event.repository.visibility == 'public' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy reviewed manual
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' && github.repository == 'Guan-Pujun/bcmp-r' && github.event.repository.visibility == 'public' }}
    needs: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
