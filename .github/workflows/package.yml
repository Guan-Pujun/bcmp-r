name: Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "R/**"
      - "src/**"
      - "man/**"
      - "inst/**"
      - "tests/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".Rbuildignore"
      - "LICENSE"
      - ".github/scripts/build.R"
      - ".github/scripts/common.R"
      - ".github/scripts/audit.py"
      - ".github/workflows/package.yml"
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  R_KEEP_PKG_SOURCE: "yes"

jobs:
  package:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Source archive and clean installation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine check scope
        id: scope
        uses: ./.github/actions/ci-scope
      - name: Prepare isolated output directories
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bcmp-ci" "$RUNNER_TEMP/bcmp-tmp"
          printf '%s\n' "BCMP_CI_OUTPUT=$RUNNER_TEMP/bcmp-ci" "TMPDIR=$RUNNER_TEMP/bcmp-tmp" >> "$GITHUB_ENV"
      - name: Set up R
        if: steps.scope.outputs.run == 'true'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: Install CI dependencies
        if: steps.scope.outputs.run == 'true'
        env:
          R_KEEP_PKG_SOURCE: "no"
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: '"hard"'
          cache-version: "build-deps-no-source-v1"
          extra-packages: |
            any::digest
      - name: Build and install outside the checkout
        if: steps.scope.outputs.run == 'true'
        run: Rscript .github/scripts/build.R
      - name: Audit tarball contents
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: python3 .github/scripts/audit.py tarball --tarball "$BCMP_CI_OUTPUT"/bcmp_*.tar.gz --output "$BCMP_CI_OUTPUT/tarball-audit.json"
      - name: Preserve validation evidence
        if: steps.scope.outputs.run == 'true' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-package
          path: |
            ${{ env.BCMP_CI_OUTPUT }}/*.log
            ${{ env.BCMP_CI_OUTPUT }}/*.txt
            ${{ env.BCMP_CI_OUTPUT }}/*.csv
            ${{ env.BCMP_CI_OUTPUT }}/*.json
            ${{ env.BCMP_CI_OUTPUT }}/*.xml
            ${{ env.BCMP_CI_OUTPUT }}/*.pdf
            ${{ env.BCMP_CI_OUTPUT }}/*.html
            ${{ env.BCMP_CI_OUTPUT }}/*.tar.gz
            ${{ env.BCMP_CI_OUTPUT }}/SHA256SUMS
            ${{ env.BCMP_CI_OUTPUT }}/check/**/*.log
            ${{ env.BCMP_CI_OUTPUT }}/check/**/*.Rout*
            ${{ env.BCMP_CI_OUTPUT }}/check/**/*.pdf
          if-no-files-found: warn
          retention-days: 14
